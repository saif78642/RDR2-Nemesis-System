; PadMenu: how a controller opens the enRAGE menu - 0 double-tap D-pad Right, 1 double-tap Left, 2 double-tap Down, 3 hold Right, 4 off.
PadMenu=0
; The game control for Let Him Go on the interrogation prompts. Any eInputType name. (Interrogate is always D-pad Up.)
LetGoPromptControl=992265328

[Interrogation]
; While you grapple a man, which of the game's prompt panels gets Interrogate: Auto (try, keep what
; shows), Target (the held man's panel), Player (Arthur's), Own (a separate panel of its own).
HeldPanel=Auto
; Interrogation FEAR (0-100) gained per act, times his fear gain (coward x2, hothead x.5 ...).
FearPerHit=6
FearPerStab=15
FearPerShot=28
FearPerShotNearHim=10
FearPerThreat=5
FearPerSecondAimedAt=2
FearPerLoot=12
; He won't answer at all below a fear set by his temper (coward 25 ... loyal 55); family needs this much more.
FamilyFearExtra=15
; Failed tries on a question before it greys out, and how much more fear opens it again.
TriesPerScare=1
ScareToRetry=10
; Fear from watching you kill near him: in an interrogation / on a nemesis's sheet.
FearPerKillSeen=14
SheetFearPerKillSeen=6

[Debug]
; Every session logs 'SEED session N' in grudges.log. Put N here to replay that session's random rolls (0 = fresh each time).
; Enabled: the developer's tools - Ctrl+F11 debug overlay (and its reset panel), Ctrl+F10 spawner, clearing the X-ray log, the hidden settings. Turn off before release.
Enabled=False
Seed=0
; True = full logs: grudges.log keeps the chatty lines (TEXT, SEAT, SETTLE, NERVE, UNEASE, CASH, FEED...) and fingerprints.log is written.
Verbose=False

[GameSystems]
; The game's own systems the mod drives (NemesisMod.GameSystems.cs). Weather = fog / storms / rain cut sight and calm things;
; Minds = his fear / anger / bravery fed to the game's AI, chargers and cautious men, drunks stagger; Body = taunt emotes,
; faces under questioning; Music = the score's duel cues (OFF: the music natives CRASHED the game, 2026-10-08); Map = new camps flash, fog lifts.
Weather=True
Minds=True
Body=True
Music=False
Map=True
; Gestures = the game's money handover / handshake / hat tip animations (on; the old crash came from a path that's gone - turn off if a social action ever freezes).
Gestures=True
; HandshakeVariant = which handshake clip: 0 upper action, 1 upper action_alt1, 2 upper action_alt2 (default - the best), 3 upper intro, 4 full body, 5 full body alt.
HandshakeVariant=2

[Meta]
; Settings format version - old defaults are migrated once, then your values are left alone.
Version=50
